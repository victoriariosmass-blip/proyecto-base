spring.application.name=VerdeGreen-API
server.port=8080

# MySQL datasource
spring.datasource.url=jdbc:mysql://localhost:3306/verdegreen?createDatabaseIfNotExist=true&serverTimezone=America/Argentina/Buenos_Aires
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.sql.init.mode=always
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# Swagger
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# Teléfono de VerdeGreen para el enlace wa.me
verdegreen.whatsapp.telefono=5492954000000
